name: renovate-lockfile

# Renovate cannot run cargo in this repository: the workspace builds against
# prepared/, which prepare.sh generates, so its Cargo.lock update fails
# (renovate/artifacts) and CI's --locked steps then stop on a stale lock. On
# Renovate's own Cargo branches, bring Cargo.lock and cargo-sources.json in
# step with the bumped Cargo.toml and push the result.
#
# Two jobs, so the write token never shares a runner with code from outside
# this repository: `resolve` runs prepare.sh, cargo and the PyPI packages
# cargo-sources.sh installs with a read-only token, and `push` only copies
# the two files it produced onto the branch.

on:
  pull_request:
    paths:
      - Cargo.toml
      - crates/*/Cargo.toml

permissions: {}

concurrency:
  group: renovate-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  resolve:
    # Only Renovate's same-repository branches.
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The commit this run was started for, in both jobs: if the branch
          # has moved since, the push below is refused and the newer run
          # does the work.
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - uses: astral-sh/setup-uv@v10.4.0

      - name: Prepare the Tuta SDK
        run: |
          git config --global --add safe.directory '*'
          sh prepare.sh

      - name: Update Cargo.lock and cargo-sources.json
        run: |
          cargo update --workspace
          scripts/cargo-sources.sh cargo-sources.json

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: lockfiles
          path: |
            Cargo.lock
            cargo-sources.json
          if-no-files-found: error
          retention-days: 1

  push:
    # This job holds a write token, so it runs nothing from the branch and
    # installs nothing: it takes the two files as data.
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: lockfiles
          path: ${{ runner.temp }}/lockfiles

      - name: Push, then start the checks
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
          LOCKFILES: ${{ runner.temp }}/lockfiles
        run: |
          for file in Cargo.lock cargo-sources.json; do
            if [ ! -f "$LOCKFILES/$file" ] || [ -L "$LOCKFILES/$file" ]; then
              echo "$file is not a plain file in the artifact" >&2
              exit 1
            fi
            cp "$LOCKFILES/$file" "$file"
          done
          if git diff --quiet -- Cargo.lock cargo-sources.json; then
            echo "Cargo.lock and cargo-sources.json already match."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock cargo-sources.json
          git commit -s -m 'chore(deps): update Cargo.lock and cargo-sources.json'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
          # A push made with GITHUB_TOKEN starts no pull_request run, but a
          # workflow_dispatch does.
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run actions-security.yml --ref "$BRANCH"
